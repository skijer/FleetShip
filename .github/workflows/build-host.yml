name: build-host

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: linux-x64
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macos-x64
            os: macos-15-intel
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      # libultraship's dependency patches only apply to the line endings they were written against.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libsdl2-net-dev libglew-dev libgl1-mesa-dev libzip-dev \
            zipcmp ziptool zipmerge libbz2-dev libpng-dev libusb-1.0-0-dev nlohmann-json3-dev libtinyxml2-dev \
            libspdlog-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja sdl2 sdl2_net glew libzip libpng nlohmann-json tinyxml2 spdlog
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.name }}
          path: x64/Release
